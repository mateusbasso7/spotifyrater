name: Compilar John's Reviewr Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sideb_flutter_codigo_fonte.zip'
      - 'sideb_flutter_id_atualizado.zip'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/**'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Montar projeto Flutter
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f sideb_flutter_id_atualizado.zip ]; then
            ZIP=sideb_flutter_id_atualizado.zip
          elif [ -f sideb_flutter_codigo_fonte.zip ]; then
            ZIP=sideb_flutter_codigo_fonte.zip
          else
            echo 'Nenhum ZIP do Side B encontrado na raiz do repositorio'
            exit 1
          fi
          mkdir -p /tmp/sideb-sources
          unzip -q "$ZIP" -d /tmp/sideb-sources
          flutter create --platforms=android --project-name=musicratings --org=com.sideb /tmp/sideb-build
          cp /tmp/sideb-sources/pubspec.yaml /tmp/sideb-build/pubspec.yaml
          cp -R /tmp/sideb-sources/lib/. /tmp/sideb-build/lib/
          cp -R /tmp/sideb-sources/test/. /tmp/sideb-build/test/
          cp /tmp/sideb-sources/android_overrides/AndroidManifest.xml /tmp/sideb-build/android/app/src/main/AndroidManifest.xml
          mkdir -p /tmp/sideb-build/android/app/src/main/kotlin/com/sideb/musicratings
          cp -R /tmp/sideb-sources/android_overrides/kotlin/com/sideb/musicratings/. /tmp/sideb-build/android/app/src/main/kotlin/com/sideb/musicratings/
          # O ZIP original tinha o primeiro Client ID: aplicar o Client ID atualizado informado no chat.
          sed -i 's/f2faa3f3a4784c64bc6bcdbf90e23e9d/a0df0a300a1d4905b6ceb08f996b56f3/g' /tmp/sideb-build/lib/src/spotify.dart
          # Atualiza o app para permitir múltiplos Client IDs, sem precisar substituir o ZIP do usuário.
          base64 -d "$GITHUB_WORKSPACE/.github/patches/sideb-multi-client-ids.diff.gz.b64" | gzip -d | (cd /tmp/sideb-build && git apply -)
          # Side B 0.3: reprodução por URI, biblioteca Spotify e avisos brancos.
          cat "$GITHUB_WORKSPACE/.github/patches/v03.part"{1,2,3,4} > /tmp/sideb_v03.b64
          echo "90ab2cccc58477e4323ce1a35d4e7762c95f0e39ee8c2c0609ec1fb6959304c0  /tmp/sideb_v03.b64" | sha256sum -c -
          base64 -d /tmp/sideb_v03.b64 | gzip -d | (cd /tmp/sideb-build && git apply -)
          # Correção pontual do fechamento do painel de detalhes do álbum (Side B 0.3).
          sed -i '732s/^      )),/      ),/' /tmp/sideb-build/lib/main.dart
          rm -f /tmp/sideb-build/test/widget_test.dart
          cp "$GITHUB_WORKSPACE/test/spotify_config_test.dart" /tmp/sideb-build/test/spotify_config_test.dart
          # file_picker 8.x usa compileSdk 34, incompatível com flutter_plugin_android_lifecycle (API 36).
          # 10.3.10 preserva FilePicker.platform e usa o compileSdk do Flutter.
          sed -i 's/file_picker: \^8\.1\.7/file_picker: ^10.3.10/' /tmp/sideb-build/pubspec.yaml
          cp -R /tmp/sideb-sources/android_overrides /tmp/sideb-build/android_overrides
          # John’s Reviewr 0.4: aplica interface, nome, backups compatíveis e App Remote.
          test "$(head -c -1 "$GITHUB_WORKSPACE/.github/patches/johns_reviewr_v04.patch.gz.b64" | sha256sum | cut -d ' ' -f1)" = "056605b9800c2d9b67575c359643a45e38f178dfec5d8355e20ee05d67b592cd"
          base64 -d "$GITHUB_WORKSPACE/.github/patches/johns_reviewr_v04.patch.gz.b64" | gzip -d | (cd /tmp/sideb-build && git apply -)
          # Sincroniza arquivos nativos alterados pelo patch com a árvore Flutter.
          cp /tmp/sideb-build/android_overrides/AndroidManifest.xml /tmp/sideb-build/android/app/src/main/AndroidManifest.xml
          cp /tmp/sideb-build/android_overrides/kotlin/com/sideb/musicratings/MainActivity.kt /tmp/sideb-build/android/app/src/main/kotlin/com/sideb/musicratings/MainActivity.kt
          test "$(head -c -1 "$GITHUB_WORKSPACE/.github/patches/johns_reviewr_v04.icon.b64" | sha256sum | cut -d ' ' -f1)" = "22696199b5830085758026c1cc99026143782f740a32f57375196a7f4d844f18"
          mkdir -p /tmp/sideb-build/assets/icons
          base64 -d "$GITHUB_WORKSPACE/.github/patches/johns_reviewr_v04.icon.b64" > /tmp/sideb-build/assets/icons/johns_reviewr.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "/tmp/sideb-build/android/app/src/main/res/mipmap-$density"
            cp /tmp/sideb-build/assets/icons/johns_reviewr.png "/tmp/sideb-build/android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          # A biblioteca oficial permite iniciar o player do Spotify instalado.
          mkdir -p /tmp/sideb-build/android/app/libs
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/spotify/android-sdk/releases/download/v0.8.0-appremote_v2.1.0-auth/spotify-app-remote-release-0.8.0.aar" \
            -o /tmp/sideb-build/android/app/libs/spotify-app-remote-release-0.8.0.aar
          test "$(stat -c %s /tmp/sideb-build/android/app/libs/spotify-app-remote-release-0.8.0.aar)" -gt 100000
          cat >> /tmp/sideb-build/android/app/build.gradle.kts <<'GRADLE'

          dependencies {
              implementation(files("libs/spotify-app-remote-release-0.8.0.aar"))
              implementation("com.google.code.gson:gson:2.11.0")
          }
          GRADLE
          # Consentimento explícito do App Remote via OAuth (0.4.1).
          python3 "$GITHUB_WORKSPACE/.github/scripts/spotify_authorization_upgrade.py" /tmp/sideb-build
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/sideb-build/lib/main.dart').read_text()
          native = Path('/tmp/sideb-build/android/app/src/main/kotlin/com/sideb/musicratings/MainActivity.kt').read_text()
          manifest = Path('/tmp/sideb-build/android/app/src/main/AndroidManifest.xml').read_text()
          assert "John's Reviewr" in source
          assert "v0.4.1" in source
          assert "Sua biblioteca." in source
          assert "playUri" in native and "SpotifyAppRemote.connect" in native
          assert 'app-remote-control' in Path('/tmp/sideb-build/lib/src/spotify.dart').read_text()
          assert 'Reautorizar reprodução' in source
          assert "John&#39;s Reviewr" in manifest
          print("John's Reviewr 0.4.1: identidade, biblioteca, controle Spotify e consentimento preparado")
          PY
          cd /tmp/sideb-build
          flutter pub get
          flutter test
      - name: Compilar APK de testes
        shell: bash
        run: |
          cd /tmp/sideb-build
          flutter build apk --debug
      - name: Identificar instalador e assinatura Spotify
        shell: bash
        run: |
          cp /tmp/sideb-build/build/app/outputs/flutter-apk/app-debug.apk /tmp/sideb-build/Johns-Reviewr-v0.4.1-debug.apk
          {
            echo "John's Reviewr 0.4.1 (+6)"
            echo "Commit: $GITHUB_SHA"
            echo "Android package: com.sideb.musicratings (mantido para preservar avaliações)"
            echo "Spotify Redirect URI: sideb://callback (mantida)"
            echo "Spotify App Remote: 0.8.0"
            echo "Prioridade: App Remote, depois Spotify Web API"
            echo "Ícone: JR em disco de vinil preto e verde"
            echo "SHA-1 do certificado deste APK:"
          } > /tmp/sideb-build/configuracao-spotify.txt
          APK_SIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --print-certs /tmp/sideb-build/Johns-Reviewr-v0.4.1-debug.apk > /tmp/sideb-build/certificate-details.txt
          python3 - <<'PY' >> /tmp/sideb-build/configuracao-spotify.txt
          import re
          from pathlib import Path
          details=Path('/tmp/sideb-build/certificate-details.txt').read_text()
          match=re.search(r'certificate SHA-1 digest:\s*([a-fA-F0-9]{40})', details)
          if not match:
              raise SystemExit('Não foi possível obter o SHA-1 do APK')
          sha=match.group(1).upper()
          print(':'.join(sha[i:i+2] for i in range(0,len(sha),2)))
          PY
                    cat /tmp/sideb-build/configuracao-spotify.txt
      - name: Disponibilizar APK John's Reviewr
        uses: actions/upload-artifact@v4
        with:
          name: johns-reviewr-v0.4.1-android
          path: |
            /tmp/sideb-build/Johns-Reviewr-v0.4.1-debug.apk
            /tmp/sideb-build/configuracao-spotify.txt
          if-no-files-found: error
